# Automated deploy: every push to main (and manual "Run workflow") SSHs to Hostinger and
# runs git pull + docker compose. You do not run deploy commands locally for routine updates.
#
# GitHub → Settings → Secrets and variables → Actions:
#   HOSTINGER_SSH_KEY (required)
#   HOSTINGER_HOST     (required)
#   HOSTINGER_USER     (required)
#   HOSTINGER_APP_PATH (optional, default /root/splitter-pro2)
#
# One-time on the VPS only: clone this repo to APP_PATH and add a root .env (see .gitignore).
# Traefik runs separately (e.g. Hostinger Docker project); use host network + Docker labels on
# this compose. Traefik command should include: --providers.docker.useBindPortIP=true
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            APP_PATH="${{ secrets.HOSTINGER_APP_PATH }}"
            [ -z "$APP_PATH" ] && APP_PATH="/root/splitter-pro2"
            if [ ! -d "$APP_PATH" ]; then
              echo "App path $APP_PATH not found. One-time: clone this repo to that path on the VPS."
              exit 1
            fi

            cd "$APP_PATH"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            if [ ! -f .env ]; then
              echo "Missing $APP_PATH/.env on server (required for first deploy check)."
              exit 1
            fi

            docker compose down --remove-orphans
            docker compose up -d --build
            docker compose ps
            docker image prune -f
