[project]
name = "backend"
version = "0.1.0"
description = "Splitter Pro 2 video splitting backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.2",
    "numpy>=2.1.0",
    "pillow>=12.1.1",
    "pydantic-settings>=2.13.1",
    "httpx>=0.28.1",
    "python-multipart>=0.0.22",
    "scenedetect[opencv-headless]<0.7",
    "uvicorn[standard]>=0.42.0",
]

[project.scripts]
backend = "backend.cli:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
