# Traefik on the VPS should route Host(`splitter.serving.cloud`) → this service (e.g. http://<host>:8000).
# Open 8000 to Traefik only (or use a Docker network shared with Traefik + labels—see your Traefik stack).
services:
  splitter-pro2:
    build: .
    ports:
      - "8000:8000"
    environment:
      SPLITTER_ALLOWED_ORIGINS: '["https://splitter.serving.cloud","http://splitter.serving.cloud","http://localhost:8000","http://127.0.0.1:8000","http://localhost:5173","http://127.0.0.1:5173"]'
    volumes:
      - splitter_data:/app/data

volumes:
  splitter_data:
