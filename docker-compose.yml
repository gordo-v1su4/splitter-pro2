# Traefik discovers this service via Docker labels (Docker socket on the host).
#
# Your Traefik stack uses network_mode: host, so it never joins a Docker bridge
# network with this container. Traefik must route to the published host port (8000).
# Add to Traefik command (required for host-mode + container backends):
#   --providers.docker.useBindPortIP=true
#
# Optional .env next to this file:
#   PUBLIC_HOST=splitter.serving.cloud

services:
  splitter-pro2:
    build: .
    ports:
      - "8000:8000"
    environment:
      SPLITTER_ALLOWED_ORIGINS: '["https://splitter.serving.cloud","http://splitter.serving.cloud","http://localhost:8000","http://127.0.0.1:8000","http://localhost:5173","http://127.0.0.1:5173"]'
    volumes:
      - splitter_data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.splitter-pro2.rule=Host(`${PUBLIC_HOST:-splitter.serving.cloud}`)"
      - "traefik.http.routers.splitter-pro2.entrypoints=websecure"
      - "traefik.http.routers.splitter-pro2.tls.certresolver=letsencrypt"
      - "traefik.http.services.splitter-pro2.loadbalancer.server.port=8000"

volumes:
  splitter_data:
