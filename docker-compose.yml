# Hostinger Caddy (container caddy-hostinger, stack /docker/caddy-hostinger) is the
# public HTTPS proxy. It joins this project's default network and routes only
# splitter.serving.cloud to splitter-pro2-splitter-pro2-1:8000.
# Do not rename the Compose project or service; the Caddyfile uses that container name.
# Do not route apex serving.cloud or www.serving.cloud to this app.

services:
  splitter-pro2:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SPLITTER_APP_ACCESS_PIN: ${SPLITTER_APP_ACCESS_PIN:-}
      SPLITTER_ALLOWED_ORIGINS: '["https://splitter.serving.cloud","http://splitter.serving.cloud","http://localhost:8000","http://127.0.0.1:8000","http://localhost:5173","http://127.0.0.1:5173"]'
      SPLITTER_MEDIA_API_URL: ${SPLITTER_MEDIA_API_URL:-https://media.v1su4.dev}
      SPLITTER_YOUTUBE_COOKIES_FILE: ${SPLITTER_YOUTUBE_COOKIES_FILE:-}
      # Accept either app-specific vars or the RustFS/media-api vars from the server .env.
      SPLITTER_MEDIA_API_TOKEN: ${SPLITTER_MEDIA_API_TOKEN:-${MEDIA_API_TOKEN:-}}
      SPLITTER_REVIEW_STORAGE_BUCKET: ${SPLITTER_REVIEW_STORAGE_BUCKET:-splitter}
      SPLITTER_REVIEW_STORAGE_PREFIX: ${SPLITTER_REVIEW_STORAGE_PREFIX:-reviews}
      SPLITTER_S3_ENDPOINT: ${SPLITTER_S3_ENDPOINT:-${S3_ENDPOINT:-${RUSTFS_PUBLIC_BASE_URL:-https://s3.v1su4.dev}}}
      SPLITTER_S3_ACCESS_KEY_ID: ${SPLITTER_S3_ACCESS_KEY_ID:-${S3_ACCESS_KEY_ID:-${RUSTFS_ACCESS_KEY:-}}}
      SPLITTER_S3_SECRET_ACCESS_KEY: ${SPLITTER_S3_SECRET_ACCESS_KEY:-${S3_SECRET_ACCESS_KEY:-${RUSTFS_SECRET_KEY:-}}}
      SPLITTER_S3_REGION: ${SPLITTER_S3_REGION:-${S3_REGION:-${RUSTFS_REGION:-us-east-1}}}
    volumes:
      - splitter_data:/app/data

volumes:
  splitter_data:
