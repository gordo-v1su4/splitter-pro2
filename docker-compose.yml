# Traefik (separate stack, often network_mode: host) discovers this service via Docker labels.
# Published port 8000 → Traefik must use: --providers.docker.useBindPortIP=true
# Override host rule: set PUBLIC_HOST_RULE in .env next to this file (Compose variable substitution).
# Default exposes both splitter.serving.cloud and serving.cloud/www.serving.cloud.

services:
  splitter-pro2:
    build: .
    ports:
      - "8000:8000"
    environment:
      SPLITTER_ALLOWED_ORIGINS: '["https://splitter.serving.cloud","http://splitter.serving.cloud","https://serving.cloud","http://serving.cloud","https://www.serving.cloud","http://www.serving.cloud","http://localhost:8000","http://127.0.0.1:8000","http://localhost:5173","http://127.0.0.1:5173"]'
      SPLITTER_MEDIA_API_URL: ${SPLITTER_MEDIA_API_URL:-https://media.v1su4.dev}
      # Accept either app-specific vars or the RustFS/media-api vars from the server .env.
      SPLITTER_MEDIA_API_TOKEN: ${SPLITTER_MEDIA_API_TOKEN:-${MEDIA_API_TOKEN:-}}
      SPLITTER_REVIEW_STORAGE_BUCKET: ${SPLITTER_REVIEW_STORAGE_BUCKET:-splitter}
      SPLITTER_REVIEW_STORAGE_PREFIX: ${SPLITTER_REVIEW_STORAGE_PREFIX:-reviews}
      SPLITTER_S3_ENDPOINT: ${SPLITTER_S3_ENDPOINT:-${RUSTFS_PUBLIC_BASE_URL:-https://s3.v1su4.dev}}
      SPLITTER_S3_ACCESS_KEY_ID: ${SPLITTER_S3_ACCESS_KEY_ID:-${RUSTFS_ACCESS_KEY:-}}
      SPLITTER_S3_SECRET_ACCESS_KEY: ${SPLITTER_S3_SECRET_ACCESS_KEY:-${RUSTFS_SECRET_KEY:-}}
      SPLITTER_S3_REGION: ${SPLITTER_S3_REGION:-${RUSTFS_REGION:-us-east-1}}
    volumes:
      - splitter_data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.splitter-pro2.rule=${PUBLIC_HOST_RULE:-Host(`splitter.serving.cloud`) || Host(`serving.cloud`) || Host(`www.serving.cloud`)}"
      - "traefik.http.routers.splitter-pro2.entrypoints=websecure"
      - "traefik.http.routers.splitter-pro2.tls.certresolver=letsencrypt"
      - "traefik.http.services.splitter-pro2.loadbalancer.server.port=8000"

volumes:
  splitter_data:
